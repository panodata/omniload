name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  integration:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.14'
          - '3.15'

    runs-on: ubuntu-latest
    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Install Microsoft ODBC (Linux)
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install msodbcsql18 -y

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: 'true'
          cache-suffix: ${{ matrix.python-version }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv pip install --editable='.[full,develop,test]'

      # The Turso sync tests run against a self-hosted `tursodb --sync-server`, which
      # ships only as a release binary. Pinned to the version of the pyturso pin, and
      # checked against the release's own checksum.
      - name: Install tursodb
        env:
          TURSODB_VERSION: v0.8.3
          TURSODB_ASSET: turso_cli-x86_64-unknown-linux-gnu.tar.xz
        run: |
          mkdir -p "$RUNNER_TEMP/tursodb" && cd "$RUNNER_TEMP/tursodb"
          base="https://github.com/tursodatabase/turso/releases/download/${TURSODB_VERSION}"
          curl -fsSLO "${base}/${TURSODB_ASSET}"
          curl -fsSLO "${base}/${TURSODB_ASSET}.sha256"
          sha256sum --check "${TURSODB_ASSET}.sha256"
          tar -xJf "${TURSODB_ASSET}"
          echo "OMNILOAD_TEST_TURSODB=$PWD/turso_cli-x86_64-unknown-linux-gnu/tursodb" >> "$GITHUB_ENV"

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Berlin"
          timezoneMacos: "Europe/Berlin"
          timezoneWindows: "European Standard Time"

      - name: Run linters and software tests
        run: poe check

      # https://github.com/codecov/codecov-action
      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: true

  # Exasol's docker-db image is 12 GB unpacked and runs privileged, so its round
  # trips get a job of their own instead of sharing the integration job's disk and
  # container matrix. The module skips unless OMNILOAD_TEST_EXASOL is set, and with
  # it set, fails rather than skips when it cannot run.
  integration-exasol:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.14'

    runs-on: ubuntu-latest
    env:
      OMNILOAD_TEST_EXASOL: '1'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: 'true'
          cache-suffix: exasol-${{ matrix.python-version }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv pip install --editable='.[full,develop,test]'
          python -c "import importlib.metadata as m; print('sqlalchemy-exasol', m.version('sqlalchemy-exasol'))"

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Berlin"

      - name: Pull the Exasol image
        run: |
          df -h /
          docker pull "$(python -c 'from tests.warehouse.manager import EXASOL_IMAGE; print(EXASOL_IMAGE)')"
          df -h /

      # One container per module, so no xdist. The junit check fails the job when
      # nothing ran, so a module that skipped cannot pass for one that was tested.
      - name: Run the Exasol tests
        run: |
          pytest tests/warehouse/db/test_exasol.py -n0 --no-cov -rA -p no:cacheprovider --junitxml=exasol-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("exasol-junit.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"Exasol tests: {tests} collected, {skipped} skipped")
          assert tests > 0 and skipped == 0, "the Exasol tests did not run"
          PY

  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'macos-latest'
          - 'windows-latest'
        python-version:
          - '3.10'
          - '3.14'
          - '3.15'

    runs-on: ${{ matrix.os }}
    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: 'true'
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv pip install --editable='.[develop,test]'

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Berlin"
          timezoneMacos: "Europe/Berlin"
          timezoneWindows: "European Standard Time"

      - name: Run Docker-free unit tests
        # Calamine and mq-bridge load incompatible native runtimes on macOS ARM.
        # Exercise both, but keep workbook tests in a separate interpreter process.
        run: |
          pytest -m "not integration" -k "not odbc" -p no:cacheprovider --ignore=tests/main/filesystem/test_spreadsheet.py
          pytest -m "not integration" -k "not odbc" -p no:cacheprovider tests/main/filesystem/test_spreadsheet.py -n1
